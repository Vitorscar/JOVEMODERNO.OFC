<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Pro Premium - Template Inteligente</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Fontes opcionais -->

  <section id="onboarding" class="onboarding">

      <button onclick="selecionarNicho('academia')">🏋️ Academia</button>

      <button onclick="selecionarNicho('dentista')">🦷 Dentista</button>

      <button onclick="selecionarNicho('outro')">✨ Outro</button>
    </div>
  </section>

  <!-- Template dinâmico (preenchido via JS) -->
  <main id="site-preview" style="display:none;"></main>

  <!-- WhatsApp Float -->
